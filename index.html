<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Mode Coppie</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --ambata-bg: #ffedd5;
            --ambata-txt: #ea580c;
            --ambo-bg: #dbeafe;
            --ambo-txt: #1d4ed8;
            --win-bg: #d1fae5;
            --win-txt: #065f46;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
        }
        .container { max-width: 550px; margin: 0 auto; }
        header {
            text-align: center; margin-bottom: 16px;
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            padding: 16px; border-radius: 12px; color: white;
        }
        header h1 { margin: 0 0 4px 0; font-size: 1.3rem; }
        .info-concorso { font-size: 0.85rem; color: #93c5fd; margin: 0; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 20px 0 10px 0; color: #0f172a; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px; }
        .card-ruota {
            background: var(--card-bg); border-radius: 12px; padding: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid var(--accent);
            margin-bottom: 12px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .ruota-title { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; color: var(--primary); }
        .spia-badge { background: #f1f5f9; color: #475569; font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .palline-box { display: flex; gap: 6px; margin-bottom: 12px; }
        .pallina {
            width: 30px; height: 30px; background: #f1f5f9; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem;
        }
        .previsione-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .prev-item { flex: 1; padding: 8px; border-radius: 8px; text-align: center; }
        .prev-item.ambata { background: var(--ambata-bg); color: var(--ambata-txt); }
        .prev-item.ambo { background: var(--ambo-bg); color: var(--ambo-txt); }
        .prev-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .prev-value { font-size: 1.1rem; font-weight: 800; }
        .ambetti-box {
            background: #fafafa; border: 1px solid #e5e7eb; padding: 6px; border-radius: 8px;
            font-size: 0.75rem; text-align: center;
        }
        .ambetti-valori { color: #4b5563; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Lotto Mode Coppie</h1>
        <p id="info-data" class="info-concorso">Algoritmo Sommativo Unificato</p>
    </header>
    
    <div class="section-title">Previsione in Corso</div>
    <div id="ruote-list"></div>

    <div class="section-title" style="margin-top: 30px;">Archivio Storico Blindato</div>
    <div id="storico-list"></div>
</div>

<script>
fetch('risultati_v4.json')
  .then(response => response.json())
  .then(data => {
    // 1. Aggiorna le informazioni generali del motore
    const infoSezione = document.createElement('div');
    infoSezione.innerHTML = `
      <p><strong>Configurazione:</strong> ${data.configurazione}</p>
      <p><strong>Ruota in gioco:</strong> <span style="color: #0056b3; font-weight: bold;">${data.ruota_base}</span></p>
      <p><strong>Input Estratto:</strong> ${data.input_estrazione}</p>
    `;
    
    // inserisce i dati sotto il titolo "PREVISIONE IN CORSO"
    const previsioneDiv = document.querySelector('.container') || document.body; 
    
    // 2. Genera il pannello dell'Ambata e dei 3 Ambi
    let ambiHtml = '';
    data.previsione.ambi_secchi.forEach((ambo, index) => {
        ambiHtml += `<li><strong>Ambo Secco ${index + 1}:</strong> ${ambo}</li>`;
    });

    const tabellaPrevisione = `
      <div style="background: #f8f9fa; border-left: 5px solid #0056b3; padding: 15px; margin: 15px 0; border-radius: 4px;">
        <h3 style="color: #ffc107; margin-top: 0;">🔥 AMBATA PRINCIPALE: ${data.previsione.ambata}</h3>
        <ul style="list-style: none; padding-left: 0; line-height: 1.8;">
            ${ambiHtml}
        </ul>
        <div style="background: #dc3545; color: white; padding: 8px; text-align: center; font-weight: bold; border-radius: 4px; margin-top: 10px;">
           🚨 STATO PROTOCOLLO: ${data.protocollo.stato} (Colpo attuale: ${data.protocollo.colpo_attuale})
        </div>
      </div>
    `;
    
    // Sostituisce o appende i dati all'interno della dashboard
    // Nota: questo script adatta dinamicamente i tuoi vecchi selettori
    document.body.innerHTML = document.body.innerHTML.replace('PREVISIONE IN CORSO', 'PREVISIONE IN CORSO' + tabellaPrevisione);
  })
  .catch(error => console.error('Errore nel caricamento del file JSON:', error));
</script>
</body>
</html>
